<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный тест по вступительным испытаниям</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drawer-transition {
            transition: transform 0.3s ease-in-out;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <!-- Заголовок и Вкладки -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-xl font-bold py-4 text-center text-indigo-600">Подготовка к вступительным испытаниям</h1>
            <nav id="tabs" class="flex space-x-4 overflow-x-auto no-scrollbar pb-2"></nav>
        </div>
    </header>

    <!-- Основной контейнер -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative">

        <!-- Верхняя панель теста (Счет, Сброс и Бургер) -->
        <div class="flex justify-between items-center mb-6">

            <!-- Левая часть: Счетчик и Кнопка "Начать заново" -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <div
                    class="text-sm sm:text-lg font-semibold text-gray-700 bg-white px-3 sm:px-4 py-1.5 rounded-full shadow-sm border whitespace-nowrap">
                    Баллы: <span id="scoreDisplay" class="text-indigo-600">0</span> / <span
                        id="totalQuestionsDisplay">0</span>
                </div>
                <button id="restartBtn"
                    class="p-1.5 sm:px-3 sm:py-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg border border-red-200 transition-colors flex items-center space-x-1 focus:outline-none"
                    title="Начать заново">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                        </path>
                    </svg>
                    <span class="hidden sm:inline font-medium text-sm">Сброс</span>
                </button>
            </div>

            <!-- Правая часть: Кнопка бургера -->
            <button id="burgerBtn"
                class="p-2 -mr-2 rounded-md hover:bg-gray-200 focus:outline-none flex items-center space-x-2 transition-colors">
                <span class="font-medium text-gray-600 hidden sm:inline">Вопросы</span>
                <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
            </button>
        </div>

        <!-- Контейнер вопроса -->
        <div id="quizContainer"
            class="bg-white rounded-2xl shadow-md p-6 sm:p-8 min-h-[300px] relative overflow-hidden">
            <!-- Содержимое вопроса рендерится здесь -->
        </div>

        <!-- Кнопки навигации -->
        <div class="flex justify-between mt-6">
            <button id="prevBtn"
                class="px-5 py-2 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition">
                &larr; Назад
            </button>
            <button id="nextBtn"
                class="px-5 py-2 bg-indigo-600 text-white rounded-lg shadow-sm hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition">
                Далее &rarr;
            </button>
        </div>

    </main>

    <!-- Боковое меню справа -->
    <div id="drawerOverlay" class="fixed inset-0 bg-black bg-opacity-30 z-40 hidden transition-opacity"></div>
    <div id="drawer"
        class="fixed inset-y-0 right-0 w-64 bg-white shadow-2xl z-50 transform translate-x-full drawer-transition flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
            <h2 class="font-bold text-lg text-gray-700">Список вопросов</h2>
            <button id="closeDrawerBtn" class="text-gray-500 hover:text-gray-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>
        <div class="p-4 overflow-y-auto flex-1">
            <div id="questionList" class="grid grid-cols-4 gap-3">
                <!-- Кнопки с номерами рендерятся здесь -->
            </div>

            <div class="mt-8 text-xs text-gray-500 space-y-2">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-gray-200"></div><span>— Нет ответа</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-green-500"></div><span>— Верно</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div><span>— Неверно</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // База данных вопросов
        const quizData = {
            oitn: {
                title: "Основы инж.-тех. наук",
                questions: [
                    {
                        "text": "Какая физическая величина характеризует быстроту изменения скорости?",
                        "options": ["Сила", "Импульс", "Ускорение", "Мощность"],
                        "correct": 2,
                        "explanation": "Ускорение — это векторная физическая величина, определяющая быстроту изменения скорости тела, то есть первую производную от скорости по времени."
                    },
                    {
                        "text": "В каких единицах измеряется кинетическая энергия в системе СИ?",
                        "options": ["Ватт", "Джоуль", "Ньютон", "Паскаль"],
                        "correct": 1,
                        "explanation": "Любая энергия, в том числе кинетическая, в Международной системе единиц (СИ) измеряется в джоулях (Дж)."
                    },
                    {
                        "text": "Какой закон утверждает, что сила действия равна силе противодействия?",
                        "options": ["Первый закон Ньютона", "Второй закон Ньютона", "Третий закон Ньютона", "Закон Гука"],
                        "correct": 2,
                        "explanation": "Третий закон Ньютона гласит: тела действуют друг на друга с силами, равными по модулю и противоположными по направлению."
                    },
                    {
                        "text": "Какая деформация возникает при действии на стержень двух равных и противоположно направленных сил, скручивающих его относительно продольной оси?",
                        "options": ["Сжатие", "Изгиб", "Кручение", "Сдвиг"],
                        "correct": 2,
                        "explanation": "Кручение — это вид деформации, возникающий под действием пар сил (моментов), плоскости действия которых перпендикулярны продольной оси стержня."
                    },
                    {
                        "text": "Что характеризует предел текучести материала?",
                        "options": ["Напряжение, при котором материал разрушается", "Напряжение, при котором деформации продолжают расти без увеличения нагрузки", "Максимально допустимое напряжение при эксплуатации", "Напряжение, при котором исчезают упругие деформации"],
                        "correct": 1,
                        "explanation": "Предел текучести — это механическое напряжение, при достижении которого деформация образца начинает расти без заметного увеличения растягивающей нагрузки (материал 'течет')."
                    },
                    {
                        "text": "Для расчетов на прочность при изгибе определяют:",
                        "options": ["Нормальные напряжения в поперечном сечении", "Только касательные напряжения", "Угол закручивания", "Абсолютное удлинение"],
                        "correct": 0,
                        "explanation": "При чистом изгибе в поперечных сечениях балки возникают только нормальные напряжения. При поперечном изгибе — нормальные и касательные, но расчет на прочность чаще всего ведут по максимальным нормальным напряжениям."
                    },
                    {
                        "text": "Как изменится общее сопротивление цепи, если два одинаковых резистора соединить параллельно вместо последовательного соединения?",
                        "options": ["Увеличится в 2 раза", "Уменьшится в 2 раза", "Уменьшится в 4 раза", "Не изменится"],
                        "correct": 2,
                        "explanation": "При последовательном соединении R_общ = 2R. При параллельном R_общ = R/2. Следовательно, сопротивление уменьшится в 4 раза (2R / (R/2) = 4)."
                    },
                    {
                        "text": "Какой прибор используется для измерения силы тока и как он подключается в цепь?",
                        "options": ["Вольтметр, параллельно", "Вольтметр, последовательно", "Амперметр, параллельно", "Амперметр, последовательно"],
                        "correct": 3,
                        "explanation": "Сила тока измеряется амперметром. Для того чтобы через прибор прошел весь измеряемый ток, его необходимо подключать в цепь последовательно с нагрузкой."
                    },
                    {
                        "text": "Что такое действующее (эффективное) значение переменного тока?",
                        "options": ["Амплитудное значение тока", "Значение постоянного тока, который выделяет за период столько же тепла, что и переменный", "Среднее арифметическое значение за полупериод", "Максимальное значение за период"],
                        "correct": 1,
                        "explanation": "Действующее значение переменного тока равно такому значению постоянного тока, которое за время, равное одному периоду переменного тока, выделит в том же сопротивлении такое же количество теплоты."
                    },
                    {
                        "text": "Каково основное назначение подшипников качения?",
                        "options": ["Передача крутящего момента между валами", "Обеспечение вращения вала с минимальным трением", "Соединение деталей в неразъемный узел", "Изменение направления движения"],
                        "correct": 1,
                        "explanation": "Подшипники служат опорами для валов и осей, обеспечивая их вращение или качание с минимальным сопротивлением трению качения."
                    },
                    {
                        "text": "Что такое передаточное отношение зубчатой передачи?",
                        "options": ["Отношение диаметров валов", "Отношение числа зубьев ведущего колеса к числу зубьев ведомого", "Отношение угловой скорости ведущего звена к угловой скорости ведомого", "Разность между числами зубьев"],
                        "correct": 2,
                        "explanation": "Передаточное отношение — это отношение угловой скорости (или частоты вращения) ведущего колеса к угловой скорости ведомого. Оно также обратно пропорционально отношению чисел зубьев."
                    },
                    {
                        "text": "Какая муфта допускает смещение осей соединяемых валов в процессе работы?",
                        "options": ["Глухая втулочная", "Фланцевая", "Зубчатая", "Продольно-свертная"],
                        "correct": 2,
                        "explanation": "Зубчатая муфта относится к компенсирующим муфтам и допускает угловые, радиальные и осевые смещения валов за счет боковых зазоров в зацеплении и сферической формы зубьев."
                    },
                    {
                        "text": "Какой химический элемент является основным легирующим компонентом нержавеющих сталей?",
                        "options": ["Углерод", "Вольфрам", "Хром", "Никель"],
                        "correct": 2,
                        "explanation": "Основным легирующим элементом, придающим стали коррозионную стойкость (нержавеющие свойства), является хром (Cr), содержание которого должно быть не менее 12-13%."
                    },
                    {
                        "text": "Чем отличается чугун от стали?",
                        "options": ["Чугун содержит меньше углерода", "Чугун содержит больше углерода (обычно > 2.14%)", "В чугуне нет железа", "Чугун мягче стали"],
                        "correct": 1,
                        "explanation": "Чугун — это сплав железа с углеродом, в котором содержание углерода превышает 2,14%. Сталь содержит менее 2,14% углерода."
                    },
                    {
                        "text": "Что такое бронза?",
                        "options": ["Сплав меди с цинком", "Сплав меди с оловом или другими элементами, кроме цинка", "Сплав алюминия с кремнием", "Сплав железа с углеродом"],
                        "correct": 1,
                        "explanation": "Бронза — это сплав на основе меди с добавлением олова, алюминия, бериллия или других элементов, за исключением цинка (сплав меди с цинком называется латунью)."
                    },
                    {
                        "text": "Какой вид механической обработки применяется для получения отверстий сплошном материале?",
                        "options": ["Фрезерование", "Точение", "Сверление", "Шлифование"],
                        "correct": 2,
                        "explanation": "Сверление — вид механической обработки материалов резанием, при котором с помощью специального вращающегося режущего инструмента (сверла) получают отверстия в сплошном слое материала."
                    },
                    {
                        "text": "В чем заключается сущность дуговой сварки?",
                        "options": ["Нагрев деталей трением до пластичного состояния", "Расплавление кромок деталей теплотой электрической дуги", "Химическая реакция с выделением тепла", "Соединение металлов с помощью расплавленного припоя"],
                        "correct": 1,
                        "explanation": "При дуговой сварке источником теплоты для расплавления кромок свариваемых деталей и присадочного материала служит электрическая дуга."
                    },
                    {
                        "text": "Какой инструмент используется при нарезании внутренней резьбы?",
                        "options": ["Плашка", "Метчик", "Резец", "Зенкер"],
                        "correct": 1,
                        "explanation": "Метчик — инструмент, предназначенный для нарезания внутренней резьбы в предварительно просверленных отверстиях. Плашка используется для наружной резьбы."
                    },
                    {
                        "text": "Что означает понятие 'взаимозаменяемость' в машиностроении?",
                        "options": ["Возможность замены станка на другой", "Свойство деталей собираться в узлы без дополнительной подгонки", "Способность материала менять свои свойства", "Возможность замены чертежа"],
                        "correct": 1,
                        "explanation": "Взаимозаменяемость — это свойство независимо изготовленных деталей или сборочных единиц обеспечивать беспригоночную сборку и безотказную работу изделия."
                    },
                    {
                        "text": "Каким прибором измеряют наружный диаметр вала с точностью до 0.05 мм?",
                        "options": ["Линейка", "Микрометр", "Штангенциркуль", "Угломер"],
                        "correct": 2,
                        "explanation": "Штангенциркуль (обычно с нониусом 0.05 или 0.1 мм) широко применяется для измерения наружных и внутренних диаметров с указанной точностью. Микрометр дает точность до 0.01 мм."
                    },
                    {
                        "text": "Что показывает шероховатость поверхности?",
                        "options": ["Точность формы детали", "Совокупность микронеровностей поверхности с малыми шагами", "Твердость поверхностного слоя", "Химический состав поверхности"],
                        "correct": 1,
                        "explanation": "Шероховатость поверхности — это совокупность неровностей поверхности с относительно малыми шагами на базовой длине, образующих микрорельеф детали."
                    },
                    {
                        "text": "Какая величина является мерой средней кинетической энергии теплового движения молекул?",
                        "options": ["Давление", "Объем", "Температура", "Внутренняя энергия"],
                        "correct": 2,
                        "explanation": "Абсолютная температура является мерой средней кинетической энергии поступательного теплового движения молекул идеального газа (E = 3/2 kT)."
                    },
                    {
                        "text": "Что утверждает второй закон термодинамики?",
                        "options": ["Энергия не возникает из ничего и не исчезает", "Теплота не может самопроизвольно переходить от менее нагретого тела к более нагретому", "КПД идеальной тепловой машины равен 100%", "При абсолютном нуле энтропия максимальна"],
                        "correct": 1,
                        "explanation": "Обоснование Клаузиуса для второго начала термодинамики: теплота не может самопроизвольно переходить от более холодного тела к более теплому."
                    },
                    {
                        "text": "Какая сила заставляет тело двигаться по окружности?",
                        "options": ["Сила трения", "Сила тяжести", "Центростремительная сила", "Кориолисова сила"],
                        "correct": 2,
                        "explanation": "Центростремительная сила — это равнодействующая всех сил, приложенных к телу, которая сообщает ему центростремительное ускорение и заставляет двигаться по окружности."
                    },
                    {
                        "text": "Как определяется механическая работа постоянной силы?",

                        "correct": 1,
                        "explanation": "Механическая работа постоянной силы равна скалярному произведению вектора силы на вектор перемещения, то есть произведению их модулей на косинус угла между ними."
                    },
                    {
                        "text": "В чем заключается закон сохранения импульса?",
                        "options": ["Импульс тела не меняется со временем", "Сумма импульсов тел замкнутой системы остается постоянной при любых взаимодействиях внутри системы", "Импульс силы равен изменению импульса тела", "Импульс зависит от массы и скорости"],
                        "correct": 1,
                        "explanation": "Векторная сумма импульсов всех тел, входящих в замкнутую систему, остается неизменной при любых взаимодействиях тел этой системы между собой."
                    },
                    {
                        "text": "Что такое эпюра?",
                        "options": ["Материал детали", "График распределения внутренних силовых факторов по длине бруса", "Прибор для измерения твердости", "Вид термообработки"],
                        "correct": 1,
                        "explanation": "Эпюра — это график, показывающий закон изменения внутренних силовых факторов (продольных сил, изгибающих моментов и т.д.) по длине стержня."
                    },
                    {
                        "text": "Как формулируется закон Гука для растяжения/сжатия?",
                        "options": ["Напряжение обратно пропорционально деформации", "Нормальное напряжение прямо пропорционально относительному удлинению", "Сила упругости равна массе", "Момент инерции не зависит от площади"],

                    },
                    {
                        "text": "Что характеризует модуль Юнга (E)?",
                        "options": ["Пластичность материала", "Твердость материала", "Жесткость материала при растяжении и сжатии", "Теплопроводность"],
                        "correct": 2,
                        "explanation": "Модуль продольной упругости (модуль Юнга) характеризует способность материала сопротивляться упругому деформированию при растяжении или сжатии."
                    },

                            "Замкнуты сами на себя",
                            "От севера к югу"
                        ],
                        "correct": 1,
                        "explanation": "Линии напряженности электростатического поля начинаются на положительных зарядах и заканчиваются на отрицательных."
                    },
                    {
                        "text": "Как называются вещества, хорошо проводящие электрический ток?",
                        "options": [
                            "Изоляторы",
                            "Полупроводники",
                            "Диэлектрики",
                            "Проводники"
                        ],
                        "correct": 3,
                        "explanation": "Проводники — вещества, в которых имеются свободные носители заряда, способные перемещаться под действием электрического поля (металлы, электролиты)."
                    },
                    {
                        "text": "Чему равно напряжение при коротком замыкании идеального источника?",
                        "options": [
                            "Бесконечности",
                            "ЭДС источника",
                            "Нулю",
                            "Половине ЭДС"
                        ],
                        "correct": 2,
                        "explanation": "При коротком замыкании внешнее сопротивление стремится к нулю, поэтому напряжение на полюсах источника (U = IR) также падает до нуля."
                    },
                    {
                        "text": "Где располагаются магнитные полюса Земли?",
                        "options": [
                            "Точно совпадают с географическими полюсами",
                            "Вблизи географических полюсов, но не совпадают с ними",
                            "На экваторе",
                            "Земля не имеет магнитного поля"
                        ],
                        "correct": 1,
                        "explanation": "Магнитные полюса Земли не совпадают с ее географическими полюсами и со временем меняют свое положение."
                    },
                    {
                        "text": "Какой спектр дает нагретый твердый металл (например, нить лампы накаливания)?",
                        "options": [
                            "Линейчатый",
                            "Полосатый",
                            "Сплошной (непрерывный)",
                            "Спектр поглощения"
                        ],
                        "correct": 2,
                        "explanation": "Нагретые твердые и жидкие тела, а также плотные газы дают сплошной (непрерывный) спектр излучения."
                    },
                    {
                        "text": "Что такое интерференция?",
                        "options": [
                            "Огибание светом препятствий",
                            "Разложение света в спектр",
                            "Усиление или ослабление света при наложении когерентных волн",
                            "Поглощение света"
                        ],
                        "correct": 2,
                        "explanation": "Интерференция — явление наложения когерентных волн, при котором образуется устойчивая картина максимумов и минимумов интенсивности."
                    },
                    {
                        "text": "Как называется явление огибания волнами препятствий?",
                        "options": [
                            "Интерференция",
                            "Дифракция",
                            "Дисперсия",
                            "Поляризация"
                        ],
                        "correct": 1,
                        "explanation": "Дифракция — это отклонение направления распространения волн от прямолинейного (огибание препятствий), соизмеримых с длиной волны."
                    },
                    {
                        "text": "Какой заряд имеет протон?",
                        "options": [
                            "Отрицательный",
                            "Нейтральный",
                            "Положительный",
                            "Зависит от атома"
                        ],
                        "correct": 2,
                        "explanation": "Протон — это стабильная элементарная частица с положительным электрическим зарядом."
                    },
                    {
                        "text": "В каком явлении наиболее ярко проявляются корпускулярные (квантовые) свойства света?",
                        "options": [
                            "Интерференция",
                            "Дифракция",
                            "Поляризация",
                            "Фотоэффект"
                        ],
                        "correct": 3,
                        "explanation": "Фотоэффект невозможно объяснить с точки зрения классической волновой теории; он объясняется тем, что свет поглощается отдельными порциями (квантами, фотонами)."
                    },
                    {
                        "text": "Что такое дефект масс ядра?",
                        "options": [
                            "Масса ядра больше массы составляющих его нуклонов",
                            "Разность между суммой масс покоя нуклонов, составляющих ядро, и массой самого ядра",
                            "Потеря массы при нагревании",
                            "Отсутствие массы у фотона"
                        ],
                        "correct": 1,
                        "explanation": "Дефект масс — это разность между суммой масс свободных протонов и нейтронов и массой образовавшегося из них ядра. Он определяет энергию связи ядра (E = Δm*c²)."
                    }
                ]
            }
        };

        // Ключ для сохранения в памяти браузера
        const STORAGE_KEY = 'examQuizProgress_v1';

        // Состояние приложения
        let currentCategory = 'oitn';
        let currentIndex = 0;

        let userAnswers = {
            oitn: {},
            russian: {},
            physics: {}
        };

        // DOM элементы
        const tabsContainer = document.getElementById('tabs');
        const quizContainer = document.getElementById('quizContainer');
        const drawer = document.getElementById('drawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const questionList = document.getElementById('questionList');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const totalQuestionsDisplay = document.getElementById('totalQuestionsDisplay');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Инициализация
        function init() {
            loadState(); // Загружаем прогресс перед отрисовкой
            renderTabs();
            switchCategory(currentCategory, true); // true = не сбрасывать индекс при загрузке

            // Обработчики событий
            document.getElementById('burgerBtn').addEventListener('click', openDrawer);
            document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);
            restartBtn.addEventListener('click', restartQuiz);

            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    saveState();
                    renderQuestion();
                }
            });
            nextBtn.addEventListener('click', () => {
                if (currentIndex < quizData[currentCategory].questions.length - 1) {
                    currentIndex++;
                    saveState();
                    renderQuestion();
                }
            });
        }

        // --- ЛОГИКА СОХРАНЕНИЯ В КЭШ (LocalStorage) ---
        function saveState() {
            const state = { currentCategory, currentIndex, userAnswers };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadState() {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                try {
                    const state = JSON.parse(savedData);
                    if (state.userAnswers) userAnswers = state.userAnswers;
                    if (state.currentCategory && quizData[state.currentCategory]) currentCategory = state.currentCategory;
                    if (state.currentIndex !== undefined) currentIndex = state.currentIndex;
                } catch (e) {
                    console.error("Ошибка при чтении сохраненных данных:", e);
                }
            }
        }

        function restartQuiz() {
            const confirmReset = confirm("Вы уверены, что хотите сбросить ВЕСЬ прогресс (ответы и баллы) по всем разделам и начать заново?");
            if (confirmReset) {
                localStorage.removeItem(STORAGE_KEY); // Очищаем кэш
                // Сбрасываем переменные
                userAnswers = { oitn: {}, russian: {}, physics: {} };
                currentCategory = 'oitn';
                currentIndex = 0;

                // Перерисовываем интерфейс
                renderTabs();
                switchCategory('oitn');
            }
        }
        // ----------------------------------------------

        // Рендер вкладок
        function renderTabs() {
            tabsContainer.innerHTML = '';
            for (const key in quizData) {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 font-medium text-sm whitespace-nowrap border-b-2 transition-colors duration-200 focus:outline-none ${key === currentCategory ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`;
                btn.textContent = quizData[key].title;
                btn.onclick = () => switchCategory(key);
                tabsContainer.appendChild(btn);
            }
        }

        // Переключение категории
        function switchCategory(categoryId, isInitLoad = false) {
            currentCategory = categoryId;
            if (!isInitLoad) {
                currentIndex = 0; // Сбрасываем вопрос на первый, только если это ручной клик по вкладке
            }
            saveState(); // Сохраняем активную вкладку
            renderTabs();
            updateScore();
            renderQuestion();
        }

        // Рендер бокового меню
        function renderDrawerContent() {
            questionList.innerHTML = '';
            const questions = quizData[currentCategory].questions;

            questions.forEach((_, index) => {
                const btn = document.createElement('button');
                const hasAnswer = userAnswers[currentCategory][index] !== undefined;
                const isCorrect = hasAnswer && userAnswers[currentCategory][index] === questions[index].correct;

                let bgColorClass = 'bg-gray-200 text-gray-700 hover:bg-gray-300';
                if (hasAnswer) {
                    bgColorClass = isCorrect ? 'bg-green-500 text-white shadow-inner' : 'bg-red-500 text-white shadow-inner';
                }

                const borderClass = (index === currentIndex) ? 'ring-2 ring-indigo-600 ring-offset-2' : '';

                btn.className = `w-10 h-10 rounded-full font-semibold flex items-center justify-center transition-all ${bgColorClass} ${borderClass}`;
                btn.textContent = index + 1;
                btn.onclick = () => {
                    currentIndex = index;
                    saveState();
                    renderQuestion();
                    closeDrawer();
                };
                questionList.appendChild(btn);
            });
        }

        function openDrawer() {
            renderDrawerContent();
            drawer.classList.remove('translate-x-full');
            drawerOverlay.classList.remove('hidden');
        }
        function closeDrawer() {
            drawer.classList.add('translate-x-full');
            drawerOverlay.classList.add('hidden');
        }

        function updateScore() {
            const answers = userAnswers[currentCategory];
            const questions = quizData[currentCategory].questions;
            let score = 0;

            for (const key in answers) {
                if (answers[key] === questions[key].correct) {
                    score++;
                }
            }

            scoreDisplay.textContent = score;
            totalQuestionsDisplay.textContent = questions.length;
        }

        // Рендер текущего вопроса
        function renderQuestion() {
            const categoryData = quizData[currentCategory];
            const qData = categoryData.questions[currentIndex];
            const hasAnswer = userAnswers[currentCategory][currentIndex] !== undefined;
            const selectedOpt = userAnswers[currentCategory][currentIndex];

            quizContainer.innerHTML = '';

            const qHeader = document.createElement('h3');
            qHeader.className = 'text-xl font-semibold text-gray-800 mb-6 fade-in text-center sm:text-left leading-relaxed';
            qHeader.textContent = `Вопрос ${currentIndex + 1} из ${categoryData.questions.length}: ${qData.text}`;
            quizContainer.appendChild(qHeader);

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'space-y-3 fade-in';

            qData.options.forEach((optText, optIndex) => {
                const optBtn = document.createElement('button');
                let baseStyle = 'w-full text-left px-5 py-4 rounded-xl border-2 transition-all duration-200 focus:outline-none flex items-center justify-between ';

                if (hasAnswer) {
                    optBtn.disabled = true;
                    optBtn.className = baseStyle + 'cursor-default ';

                    if (optIndex === qData.correct) {
                        optBtn.className += 'bg-green-50 border-green-500 text-green-800';
                        optBtn.innerHTML = `<span>${optText}</span> <svg class="w-6 h-6 text-green-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                    } else if (optIndex === selectedOpt) {
                        optBtn.className += 'bg-red-50 border-red-500 text-red-800';
                        optBtn.innerHTML = `<span>${optText}</span> <svg class="w-6 h-6 text-red-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                    } else {
                        optBtn.className += 'border-gray-200 text-gray-500 opacity-60';
                        optBtn.innerHTML = `<span>${optText}</span>`;
                    }
                } else {
                    optBtn.className = baseStyle + 'border-gray-200 text-gray-700 hover:border-indigo-400 hover:bg-indigo-50';
                    optBtn.innerHTML = `<span>${optText}</span>`;
                    optBtn.onclick = () => handleAnswer(optIndex);
                }

                optionsContainer.appendChild(optBtn);
            });
            quizContainer.appendChild(optionsContainer);

            if (hasAnswer) {
                const feedbackDiv = document.createElement('div');
                const isCorrect = selectedOpt === qData.correct;

                let feedbackHTML = '';
                if (isCorrect) {
                    feedbackDiv.className = 'mt-6 p-4 bg-green-100 rounded-lg border-l-4 border-green-500 fade-in';
                    feedbackHTML = `<p class="font-bold text-green-800 mb-1">Верно!</p>`;
                } else {
                    feedbackDiv.className = 'mt-6 p-4 bg-red-100 rounded-lg border-l-4 border-red-500 fade-in';
                    feedbackHTML = `<p class="font-bold text-red-800 mb-1">Неверно.</p>
                                    <p class="text-sm text-red-700 mb-2">Правильный ответ: <strong>${qData.options[qData.correct]}</strong></p>`;
                }

                feedbackHTML += `<p class="text-sm text-gray-700 leading-relaxed">${qData.explanation}</p>`;
                feedbackDiv.innerHTML = feedbackHTML;
                quizContainer.appendChild(feedbackDiv);
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === categoryData.questions.length - 1;
        }

        function handleAnswer(selectedOptIndex) {
            userAnswers[currentCategory][currentIndex] = selectedOptIndex;
            saveState(); // Сохраняем в кэш после каждого ответа
            updateScore();
            renderQuestion();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
